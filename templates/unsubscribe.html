<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe - OutreachPro by Saad Akram</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f7f9;color:#222;display:flex;align-items:center;justify-content:center;min-height:90vh;margin:0}
.card{background:#fff;border-radius:12px;padding:32px;max-width:420px;box-shadow:0 2px 16px rgba(0,0,0,.08);text-align:center}
h2{margin:0 0 8px}p{color:#666;font-size:14px}
button{background:#d33;color:#fff;border:0;border-radius:8px;padding:10px 24px;font-size:15px;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <h2>Unsubscribe?</h2>
  <p>Hi {{ name }}, click below to stop receiving outreach emails at <b>{{ email }}</b>.</p>
  <form method="post"><button type="submit">Yes, unsubscribe me</button></form>
</div>
</body>
</html>
